; cPanel-generated php ini directives, do not edit
; Manual editing of this file may result in unexpected behavior.
; To make changes to this file, use the cPanel MultiPHP INI Editor (Home >> Software >> MultiPHP INI Editor)
; For more information, read our documentation (https://go.cpanel.net/EA4ModifyINI)

[PHP]
display_errors = Off
max_execution_time = 30
max_input_time = 60
max_input_vars = 1000
memory_limit = 256M
post_max_size = 516M
session.gc_maxlifetime = 1440
; session.save_path: omit locally (cPanel path is Linux-only). PHP uses its default writable session dir on Laragon.
upload_max_filesize = 512M
zlib.output_compression = Off
include_path = ".:/home1/aztechn1/public_html/Production/huskies/include:/home1/aztechn1/public_html/Production/huskies/config:/home1/aztechn1/public_html/Production/huskies/languages:/home1/aztechn1/public_html/Production/huskies/ini"
[MySQLi]
[Session]
session.cookie_httponly = "1"
session.cookie_lifetime = 3600
session.cookie_secure = "0"
; ^ http://*.test on Laragon cannot set Secure cookies. Use "1" on production behind HTTPS (cPanel MultiPHP if needed).
session.hash_bits_per_character = 6
session.hash_function = "7"
session.use_cookies = On
session.use_only_cookies = On
session.use_strict_mode = On
